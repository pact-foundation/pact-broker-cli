name: Notify package managers

# Tells pact-foundation/homebrew-tap and pact-foundation/scoop about a new
# release; each opens a PR bumping its formula or manifest. Chocolatey
# (pact-foundation/choco) builds from the scoop manifests, so scoop triggers it
# once that PR merges.
on:
  workflow_call:
    inputs:
      plan:
        description: dist plan JSON (dist post-announce jobs pass this)
        type: string
        default: ''
      tag:
        description: Release tag, used when there is no plan
        type: string
        default: ''
      prerelease:
        description: Whether the release is a prerelease, used when there is no plan
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.8.8)'
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # A reusable workflow sees the caller's event name, so detect the dist
      # call by its plan rather than by github.event_name.
      - name: Resolve release
        id: release
        env:
          PLAN: ${{ inputs.plan }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG_PREFIX: 'v'
        run: |
          if [[ -n "$PLAN" ]]; then
            TAG=$(jq -r '.announcement_tag' <<<"$PLAN")
            PRERELEASE=$(jq -r '.announcement_is_prerelease' <<<"$PLAN")
          fi
          if [[ "$TAG" != "$TAG_PREFIX"* ]]; then
            echo "::notice::$TAG is not a pact-broker-cli release; nothing to notify"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PRERELEASE" == true ]]; then
            echo "::notice::$TAG is a prerelease; package managers stay on the last stable release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#"$TAG_PREFIX"}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "::error::Cannot read a version from tag '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token
        if: steps.release.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}
          owner: pact-foundation
          repositories: homebrew-tap,scoop
      # homebrew-tap reads `version`; scoop reads `tag`.
      - name: Dispatch to homebrew-tap
        if: steps.release.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: pact-foundation/homebrew-tap
          event-type: pact-broker-cli-released
          client-payload: |
            {
              "type": "pact-broker-cli-released",
              "version": "${{ steps.release.outputs.version }}",
              "tag": "${{ steps.release.outputs.tag }}"
            }
      - name: Dispatch to scoop
        if: steps.release.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: pact-foundation/scoop
          event-type: pact-broker-cli-released
          client-payload: |
            {
              "type": "pact-broker-cli-released",
              "version": "${{ steps.release.outputs.version }}",
              "tag": "${{ steps.release.outputs.tag }}"
            }
